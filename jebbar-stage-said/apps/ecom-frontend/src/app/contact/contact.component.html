<div class="container mx-auto py-12 px-4">
  <h2 class="text-4xl font-bold text-center text-gray-800 mb-8">Contactez-nous</h2>
  <div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow-md">
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
      <div class="mb-6">
        <label for="name" class="block text-gray-700 text-sm font-semibold mb-2">Nom complet</label>
        <input type="text" id="name" formControlName="name" class="w-full px-4 py-2 border rounded-lg text-gray-700 focus:outline-none focus:border-primary">
        <div *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched" class="text-red-500 text-sm mt-1">
          Le nom est requis
        </div>
      </div>
      
      <div class="mb-6">
        <label for="email" class="block text-gray-700 text-sm font-semibold mb-2">Adresse e-mail</label>
        <input type="email" id="email" formControlName="email" class="w-full px-4 py-2 border rounded-lg text-gray-700 focus:outline-none focus:border-primary">
        <div *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched" class="text-red-500 text-sm mt-1">
          Veuillez entrer une adresse email valide
        </div>
      </div>
      
      <div class="mb-6">
        <label for="message" class="block text-gray-700 text-sm font-semibold mb-2">Votre message</label>
        <textarea id="message" formControlName="message" rows="4" class="w-full px-4 py-2 border rounded-lg text-gray-700 focus:outline-none focus:border-primary"></textarea>
        <div *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched" class="text-red-500 text-sm mt-1">
          Le message est requis
        </div>
      </div>
      
      <button type="submit" [disabled]="contactForm.invalid || isSubmitting" class="w-full bg-primary text-white py-3 px-6 rounded-lg hover:bg-primary-focus transition-colors duration-300">
        <span *ngIf="!isSubmitting">Envoyer</span>
        <span *ngIf="isSubmitting" class="flex items-center justify-center">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Envoi en cours...
        </span>
      </button>
    </form>

    <!-- Message de succès -->
    <div *ngIf="submitSuccess" class="mt-4 p-4 bg-green-100 text-green-700 rounded-lg">
      Votre message a été envoyé avec succès ! Nous vous répondrons dans les plus brefs délais.
    </div>

    <!-- Message d'erreur -->
    <div *ngIf="submitError" class="mt-4 p-4 bg-red-100 text-red-700 rounded-lg">
      {{ errorMessage }}
    </div>
  </div>
</div>
