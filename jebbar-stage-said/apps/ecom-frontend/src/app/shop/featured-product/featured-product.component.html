<div class="container mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Nos Nouveaux Produits</h2>
    <div class="flex space-x-2">
      <button 
        *ngIf="products().length > 4"
        (click)="previousSlide()" 
        class="p-2 rounded-full bg-gray-100 hover:bg-gray-200 transition-colors duration-200"
      >
        <fa-icon [icon]="faChevronLeft" class="text-gray-600"></fa-icon>
      </button>
      <button 
        *ngIf="products().length > 4"
        (click)="nextSlide()" 
        class="p-2 rounded-full bg-gray-100 hover:bg-gray-200 transition-colors duration-200"
      >
        <fa-icon [icon]="faChevronRight" class="text-gray-600"></fa-icon>
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (product of getVisibleProducts(); track product.publicId) {
      <ecom-product-card [product]="product" />
    }
  </div>
</div>
