    Votre navigateur ne prend pas en charge la vidéo.
  </video>
  <div class="hero-overlay bg-opacity-20"></div>
  <div class="hero-content justify-start text-neutral-content w-full px-6 sm:px-8 lg:px-10 mt-16">
